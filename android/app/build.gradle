plugins {
    id 'com.android.application'
}

// APK_FLAVOR=dev installs beside the stable app (applicationId + ".dev", its own
// Android/data folder and saves, label "HGSS dev"). tools/android/build_apk.sh defaults
// to dev; CI and releases pass APK_FLAVOR=stable. A bare gradle run is stable.
def apkFlavor = System.getenv('APK_FLAVOR') ?: 'stable'
if (!(apkFlavor in ['dev', 'stable'])) {
    throw new GradleException("APK_FLAVOR must be dev or stable, not '${apkFlavor}'")
}

android {
    namespace 'org.pokeplatinum.port'
    compileSdk 35

    defaultConfig {
        applicationId 'org.pokeheartgold.port'
        // Android 10+: the AYN Thor ships Android 13
        minSdk 29
        targetSdk 35
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName System.getenv('VERSION_NAME') ?: 'dev'

        if (apkFlavor == 'dev') {
            applicationIdSuffix '.dev'
        }
        manifestPlaceholders = [appLabel: apkFlavor == 'dev' ? 'HGSS dev' : 'HGSS']

        ndk {
            // libmain.so is built by meson for arm64 only (see .github/workflows/build_android.yml)
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        // A fixed key so every CI build can be installed over the previous one.
        // Uninstalling would delete Android/data/org.pokeheartgold.port (and your saves).
        stable {
            storeFile file('stable.keystore')
            storePassword 'android'
            keyAlias 'pokeplatinum'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.stable
        }
        release {
            signingConfig signingConfigs.stable
            minifyEnabled false
        }
    }

    lint {
        // Release builds run lint's "vital" checks; none of them are worth failing a
        // sideloaded build over (e.g. Play Store target SDK deadlines).
        checkReleaseBuilds false
        abortOnError false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // SDL's Java sources are copied into src/main/java/org/libsdl/app by CI from the
    // same SDL release the native library is built from, so the two always match.
}
