# Compile check of the Android configuration without the NDK: clang 18 (as in NDK r27)
# targeting aarch64 Linux with the Android defines (-Dbuild_target=android). Without
# __ANDROID__ libntr skips the Android-only libraries, so only compiling is meaningful:
#   meson setup build_android_check -Dbuild_target=android \
#       --native-file=meson/native.ini --cross-file=meson/cross_aarch64_check.ini
#   ninja -C build_android_check libhgss_game.a
# Needs clang-18, llvm-18, lld-18, the aarch64 C headers (libc6-dev-arm64-cross on Ubuntu)
# and the host's SDL2 headers (libsdl2-dev).

[binaries]
c = ['clang-18', '--target=aarch64-linux-gnu']
cpp = ['clang++-18', '--target=aarch64-linux-gnu']
c_ld = 'lld'
cpp_ld = 'lld'
ar = 'llvm-ar-18'
strip = 'llvm-strip-18'

[constants]
# libntr's headers include SDL's (the host's libsdl2-dev). Its build configuration header is
# per architecture; meson/aarch64_check/ has a minimal aarch64 stand-in.
sdl_config = ['-idirafter', '@DIRNAME@' / 'aarch64_check']

[built-in options]
c_args = ['-fno-strict-aliasing', '-fwrapv', '-U_FORTIFY_SOURCE'] + sdl_config
cpp_args = ['-fno-strict-aliasing', '-fwrapv', '-U_FORTIFY_SOURCE'] + sdl_config

[host_machine]
# Same as cross_android.ini: meson refuses NASM for non-x86 hosts
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
