# Cross file for the Android (Thor) build with the NDK, same settings as the Platinum port's
# tools/android/build_apk.sh. Replace the three constants (or let the APK script write its own
# copy), then:
#   meson setup -Dbuild_target=android -Doptimization=2 \
#       --native-file=meson/native.ini --cross-file=meson/cross_android.ini build_android
#   meson compile -C build_android main
# The result is build_android/main.so, which the APK packs as libmain.so.

[constants]
toolchain = '/path/to/android-ndk/toolchains/llvm/prebuilt/linux-x86_64/bin'
api = '28'
# SDL2 and enet built for arm64-v8a (include/ and lib/)
prefix = '/path/to/android-deps'

[binaries]
c = toolchain / 'aarch64-linux-android' + api + '-clang'
cpp = toolchain / 'aarch64-linux-android' + api + '-clang++'
ar = toolchain / 'llvm-ar'
strip = toolchain / 'llvm-strip'

[built-in options]
# The decompiled game code type-puns and relies on wrapping signed arithmetic (as the DS
# compiler allowed), so optimize without strict aliasing or signed-overflow UB. libntr also
# writes across neighbouring hardware-register variables in places, which FORTIFY would
# abort on.
c_args = ['-I' + prefix / 'include', '-fno-strict-aliasing', '-fwrapv', '-U_FORTIFY_SOURCE']
cpp_args = ['-I' + prefix / 'include', '-fno-strict-aliasing', '-fwrapv', '-U_FORTIFY_SOURCE']
c_link_args = ['-L' + prefix / 'lib']
cpp_link_args = ['-L' + prefix / 'lib']

[host_machine]
# Really android/aarch64; the NDK compiler targets that no matter what meson is told.
# - system: meson forces -fPIE on every target for 'android', which breaks linking the
#   static libraries into libmain.so. Everything is built with -fPIC instead.
# - cpu: meson refuses NASM for non-x86 hosts, and libntr declares NASM (only DS builds use
#   it). Same workaround as the Platinum port.
system = 'linux'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'
