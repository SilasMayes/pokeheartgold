name: build_port

# Native port build (meson + libntr). The DS ROM keeps building with make and is not
# touched here.

on:
  push:
    branches: [ thor-android ]
    paths-ignore:
      - '**.md'
  pull_request:
    branches: [ thor-android ]
  workflow_dispatch:

concurrency:
  group: build_port-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        timeout-minutes: 15
        run: |
          sudo apt-get update -y -o Acquire::Retries=3 -o Acquire::http::Timeout=60
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
            git python3 python3-pip gcc g++ ninja-build nasm libsdl2-dev libenet-dev
          pip install --break-system-packages 'meson>=1.3'

      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Source list is current
        run: python3 tools/port/gen_meson_sources.py --check

      - name: Configure
        run: meson setup build_linux -Dbuild_target=linux

      - name: Compile
        run: |
          set -o pipefail
          ninja -C build_linux -k 0 libhgss_game.a libhgss_lobby.a 2>&1 | tee compile.log

      # Links with --no-undefined. Until the data tables (asm/*.s -> C) and the remaining
      # libntr stubs land, this lists what is still missing instead of failing the run.
      - name: Link
        id: link
        continue-on-error: true
        run: |
          set -o pipefail
          ninja -C build_linux main 2>&1 | tee link.log

      - name: Missing symbols
        if: steps.link.outcome == 'failure'
        run: |
          grep -oE "undefined reference to \`[^']+'" link.log | sed -E "s/undefined reference to \`(.*)'/\1/" | sort -u > missing.txt
          echo "::warning title=Link::$(wc -l < missing.txt) undefined symbols (see the missing_symbols artifact)"

      - name: Upload missing symbols
        if: steps.link.outcome == 'failure'
        uses: actions/upload-artifact@v6
        with:
          name: missing_symbols
          path: missing.txt

  # Game code compiled the way the Android build sees it (aarch64, SDK_BUILD_ANDROID,
  # clang 18 as in NDK r27), without the NDK: catches clang-only errors early.
  android-defines:
    runs-on: ubuntu-24.04
    steps:
      - name: Install Software
        timeout-minutes: 15
        run: |
          sudo apt-get update -y -o Acquire::Retries=3 -o Acquire::http::Timeout=60
          sudo apt-get install -y --no-install-recommends -o Acquire::Retries=3 -o Acquire::http::Timeout=60 \
            git python3 python3-pip gcc g++ clang-18 llvm-18 lld-18 ninja-build nasm \
            libc6-dev-arm64-cross libgcc-13-dev-arm64-cross libsdl2-dev
          pip install --break-system-packages 'meson>=1.3'

      - name: Checkout Repo
        uses: actions/checkout@v5

      - name: Configure
        run: |
          meson setup build_android_check -Dbuild_target=android \
            --native-file=meson/native.ini --cross-file=meson/cross_aarch64_check.ini

      - name: Compile
        run: ninja -C build_android_check -k 0 libhgss_game.a
